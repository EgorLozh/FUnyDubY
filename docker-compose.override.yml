name: dubbing

# Dev-оверрайды: горячая перезагрузка api/фронтенда.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./data:/data
      - ./backend/app:/srv/app/app
      - ./backend/migrations:/srv/app/migrations

  frontend:
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
