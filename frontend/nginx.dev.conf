# dev-конфиг фронтенда: без CSP, чтобы Vite HMR не ругался
upstream dubbing_api_dev {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2048m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://dubbing_api_dev;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
