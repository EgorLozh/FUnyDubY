# Dev-конфиг фронтенда: то же, что прод, но без кеша статики — чтобы правки были видны сразу.
server {
    listen 80;
    server_name _;

    # Docker DNS: имя контейнера api меняет адрес при пересоздании, а nginx с upstream-блоком
    # держит адрес с момента старта — после `--force-recreate api` все запросы дают 502.
    # Резолвим на каждом запросе через переменную.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dubbing_api http://api:8000;

    client_max_body_size 2048m;
    client_body_timeout 600s;

    location /api/rooms/ {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $dubbing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass $dubbing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
