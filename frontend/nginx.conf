# Прод/деф конфиг: статика + прокси на api, SSE без буферизации.
server {
    listen 80;
    server_name _;

    # Docker DNS: имя контейнера api меняет адрес при пересоздании, а nginx с upstream-блоком
    # держит адрес с момента старта — после `--force-recreate api` все запросы дают 502.
    # Резолвим на каждом запросе через переменную.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dubbing_api http://api:8000;

    client_max_body_size 2048m;
    client_body_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Один блок на весь API: отдельный location /api/rooms/ давал 301 на POST /api/rooms
    # (nginx добавляет косую черту к префиксу с косой чертой) и терял порт в Location.
    location ^~ /api/ {
        # прогресс обработки идёт через SSE — буферизация выключена
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $dubbing_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
